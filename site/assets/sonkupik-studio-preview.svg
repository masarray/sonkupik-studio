<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">KTV PRO K500 with SONKUPIK STUDIO</title>
<desc id="desc">More than a digital mixer: music key control, studio-style vocal effects, parametric EQ and multi-channel room DSP.</desc>
<defs>
