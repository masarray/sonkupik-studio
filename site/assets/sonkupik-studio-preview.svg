  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#69dfd1"/><stop offset=".55" stop-color="#81a8ff"/><stop offset="1" stop-color="#c49bff"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#69dfd1" stop-opacity=".2"/><stop offset="1" stop-color="#69dfd1" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".5"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="925" cy="190" r="350" fill="url(#halo)"/>
<g opacity=".12" stroke="#a5bdd0"><path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/><path d="M100 0v630M200 0v630M300 0v630M400 0v630M500 0v630M600 0v630M700 0v630M800 0v630M900 0v630M1000 0v630M1100 0v630"/></g>

