  <text x="88" y="53" fill="#8fa4b5" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1.2">KTV PRO K500 CONTROL ROOM</text>
</g>

<text x="70" y="228" fill="#edf5fb" font-family="Segoe UI,Arial,sans-serif" font-size="53" font-weight="600" letter-spacing="-2">More than a digital mixer.</text>
<text x="70" y="288" fill="url(#accent)" font-family="Segoe UI,Arial,sans-serif" font-size="53" font-weight="600" letter-spacing="-2">A complete karaoke DSP.</text>
<text x="72" y="338" fill="#a7b8c5" font-family="Segoe UI,Arial,sans-serif" font-size="20">Comfortable song keys. Polished vocal space.</text>
<text x="72" y="368" fill="#a7b8c5" font-family="Segoe UI,Arial,sans-serif" font-size="20">Precise tone shaping. Repeatable room control.</text>

<g transform="translate(70 414)" font-family="Segoe UI,Arial,sans-serif">
  <g><rect width="110" height="39" rx="9" fill="#69dfd1" fill-opacity=".11" stroke="#69dfd1" stroke-opacity=".38"/><text x="17" y="25" fill="#c4f5ef" font-size="14">KEY ±7</text></g>
  <g transform="translate(124)"><rect width="156" height="39" rx="9" fill="#81a8ff" fill-opacity=".09" stroke="#81a8ff" stroke-opacity=".34"/><text x="17" y="25" fill="#d4dfff" font-size="14">REVERB + ECHO</text></g>
  <g transform="translate(294)"><rect width="157" height="39" rx="9" fill="#c49bff" fill-opacity=".09" stroke="#c49bff" stroke-opacity=".34"/><text x="17" y="25" fill="#eadcff" font-size="14">10-BAND MIC PEQ</text></g>
  <g transform="translate(465)"><rect width="129" height="39" rx="9" fill="#69dfd1" fill-opacity=".08" stroke="#69dfd1" stroke-opacity=".3"/><text x="17" y="25" fill="#c4f5ef" font-size="14">ROOM DSP</text></g>
</g>

