name: Sync static all-platform landing copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-public-platform-copy.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Update Indonesian and English static copy
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace(path, pairs):
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old[:100]}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          replace(Path('site/index.html'), [
              ('<title>Download SONKUPIK STUDIO untuk Windows | KTV PRO K500</title>',
               '<title>Download SONKUPIK STUDIO | Windows, macOS &amp; Linux</title>'),
              ('<meta name="description" content="Download SONKUPIK STUDIO, aplikasi desktop untuk kontrol, preset, PEQ, crossover, efek vokal dan manajemen KTV PRO K500. Installer Windows tersedia langsung.">',
               '<meta name="description" content="Download SONKUPIK STUDIO untuk Windows, macOS Intel/Apple Silicon, dan Linux x64/ARM64. Control room desktop untuk KTV PRO K500.">'),
              ('<meta name="twitter:description" content="Control room desktop untuk KTV PRO K500. Windows installer tersedia sekarang.">',
               '<meta name="twitter:description" content="Control room desktop KTV PRO K500 untuk Windows, macOS dan Linux.">'),
              ('"operatingSystem":"Windows 10/11 64-bit",',
               '"operatingSystem":"Windows 10/11 64-bit; macOS Intel/Apple Silicon; Linux x64/ARM64",'),
              ('Distribusi publik saat ini ditujukan untuk Windows 10 dan Windows 11 64-bit. Paket macOS dan Linux belum tersedia.',
               'v0.8.44 tersedia publik untuk Windows 10/11 x64, macOS Intel/Apple Silicon, dan Linux x64/ARM64. Paket macOS belum Developer ID signed/notarized sehingga Gatekeeper dapat memberi peringatan.'),
              ('<li>Windows 10/11 64-bit</li>\n        <li>Setup + Portable</li>',
               '<li>Windows · macOS · Linux</li>\n        <li>x64 + ARM64</li>'),
              ('<span class="platform-copy"><strong>macOS</strong><small data-platform-status>Belum tersedia</small></span>',
               '<span class="platform-copy"><strong>macOS</strong><small data-platform-status>Pilih arsitektur di bawah</small></span>'),
              ('<span class="platform-copy"><strong>Linux</strong><small data-platform-status>Belum tersedia</small></span>',
               '<span class="platform-copy"><strong>Linux</strong><small data-platform-status>Pilih arsitektur di bawah</small></span>'),
              ('<p class="availability-note"><strong>macOS dan Linux:</strong> tombol akan aktif otomatis ketika paket resmi tersedia pada release publik.</p>',
               '<p class="availability-note"><strong>Status lintas platform:</strong> v0.8.44 tersedia publik untuk Windows, macOS dan Linux. DMG macOS belum signed/notarized; verifikasi download dengan SHA-256.</p>'),
              ('Distribusi publik saat ini ditujukan untuk Windows 10/11 64-bit. Paket macOS dan Linux belum tersedia; tombolnya sengaja dinonaktifkan agar tidak memberi kesan ada installer yang sebenarnya belum dirilis.',
               'v0.8.44 tersedia publik untuk Windows 10/11 x64, macOS Intel/Apple Silicon, dan Linux x64/ARM64. DMG macOS belum signed/notarized dan dapat memicu Gatekeeper; build Mac/Linux telah melewati verifikasi CI.'),
              ('<p>Download installer terbaru untuk Windows. Tidak perlu membuka folder repo atau mencari file release secara manual.</p>',
               '<p>Windows, macOS dan Linux tersedia dari panel download di atas. Pilih platform dan arsitektur yang sesuai tanpa mencari file release secara manual.</p>'),
          ])

          replace(Path('site/en/index.html'), [
              ('<title>Download SONKUPIK STUDIO for Windows | KTV PRO K500</title>',
               '<title>Download SONKUPIK STUDIO | Windows, macOS &amp; Linux</title>'),
              ('<meta name="description" content="Download SONKUPIK STUDIO, the desktop app for KTV PRO K500 control, presets, PEQ, crossover, vocal effects and speaker management. Windows installer available now.">',
               '<meta name="description" content="Download SONKUPIK STUDIO for Windows, macOS Intel/Apple Silicon, and Linux x64/ARM64. Desktop control room for KTV PRO K500.">'),
              ('<meta name="twitter:description" content="Desktop control room for KTV PRO K500. Windows installer available now.">',
               '<meta name="twitter:description" content="KTV PRO K500 desktop control room for Windows, macOS and Linux.">'),
              ('"operatingSystem":"Windows 10/11 64-bit",',
               '"operatingSystem":"Windows 10/11 64-bit; macOS Intel/Apple Silicon; Linux x64/ARM64",'),
              ('The current public distribution targets Windows 10 and Windows 11 64-bit. macOS and Linux packages are not available yet.',
               'v0.8.44 is public for Windows 10/11 x64, macOS Intel/Apple Silicon, and Linux x64/ARM64. macOS DMGs are not Developer ID signed/notarized yet, so Gatekeeper may warn.'),
              ('<li>Windows 10/11 64-bit</li>\n        <li>Setup + Portable</li>',
               '<li>Windows · macOS · Linux</li>\n        <li>x64 + ARM64</li>'),
              ('<span class="platform-copy"><strong>macOS</strong><small data-platform-status>Not available yet</small></span>',
               '<span class="platform-copy"><strong>macOS</strong><small data-platform-status>Choose architecture below</small></span>'),
              ('<span class="platform-copy"><strong>Linux</strong><small data-platform-status>Not available yet</small></span>',
               '<span class="platform-copy"><strong>Linux</strong><small data-platform-status>Choose architecture below</small></span>'),
              ('<p class="availability-note"><strong>macOS and Linux:</strong> these buttons will enable automatically when official packages are published in a public release.</p>',
               '<p class="availability-note"><strong>Cross-platform status:</strong> v0.8.44 is public for Windows, macOS and Linux. macOS DMGs are not signed/notarized; verify downloads with SHA-256.</p>'),
              ('The current public distribution targets Windows 10/11 64-bit. macOS and Linux packages are not available yet; their buttons remain disabled so the page never suggests an installer exists when it has not been released.',
               'v0.8.44 is public for Windows 10/11 x64, macOS Intel/Apple Silicon, and Linux x64/ARM64. macOS DMGs are not signed/notarized and may trigger Gatekeeper; Mac/Linux builds passed CI verification.'),
              ('<p>Download the latest Windows installer. No repository browsing and no manual release-file hunting.</p>',
               '<p>Windows, macOS and Linux are available from the download panel above. Choose the correct platform and architecture without hunting through release files.</p>'),
          ])
          PY

      - name: Validate synchronized website
        run: python tools/validate-site.py

      - name: Commit static landing synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html site/en/index.html
          git diff --cached --check
          git commit -m 'Sync static landing with all-platform release'
          git push origin HEAD:main
