name: Apply download UI polish to source HTML

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-download-ui-polish.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate and polish download panels
        run: |
          python tools/sync-direct-download.py
          python tools/polish-download-ui.py
          python tools/validate-site.py
          python tools/validate-download-ui.py
      - name: Commit synchronized HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html site/en/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Source HTML already synchronized.'
            exit 0
          fi
          git commit -m 'Polish cross-platform download panel UI'
          git push origin HEAD:main
