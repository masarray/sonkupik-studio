name: Apply direct-download landing sync

on:
  push:
    branches: [main]
    paths:
      - 'tools/sync-direct-download.py'
      - '.github/workflows/apply-direct-download-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Synchronize landing downloads
        run: python tools/sync-direct-download.py
      - name: Validate site
        run: python tools/validate-site.py
      - name: Commit synchronized landing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html site/en/index.html site/download.js site/polish.css
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Landing already synchronized.'
            exit 0
          fi
          git commit -m 'Expose direct installers for every platform'
          git push origin HEAD:main
