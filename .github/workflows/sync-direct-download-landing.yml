name: Sync direct-download landing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-direct-download-landing.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Make every platform a direct download
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          BASE = 'https://github.com/masarray/sonkupik-studio/releases/download/v0.8.44/'

          id_block = f'''      <div class="direct-download-grid" data-platform-matrix aria-label="Download langsung berdasarkan sistem operasi">
        <article class="download-os-card is-recommended" data-platform-download="windows">
          <div class="download-os-head">
            <svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2 3.5 10.5 2v9H2v-7.5Zm9.5-1.7L22 0v11h-10.5V1.8ZM2 12h8.5v9L2 19.5V12Zm9.5 0H22v11l-10.5-1.8V12Z"/></svg>
            <div><strong>Windows</strong><span>Windows 10/11 · x64</span></div>
            <small data-group-status="windows">Recommended</small>
          </div>
          <a class="direct-package primary-package" data-download="setup" href="{BASE}SONKUPIK-STUDIO-0.8.44-Setup.exe">
            <span><strong>Windows Setup</strong><small>Installer · <span data-setup-size>±100 MB</span></small></span><b>Download</b>
          </a>
          <a class="direct-package" data-download="portable" href="{BASE}SONKUPIK-STUDIO-0.8.44-Portable.exe">
            <span><strong>Portable .exe</strong><small>Tanpa instalasi · <span data-portable-size>±100 MB</span></small></span><b>Download</b>
          </a>
        </article>

        <article class="download-os-card" data-platform-download="macos">
          <div class="download-os-head">
            <svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.2 12.4c0-2.7 2.2-4 2.3-4.1-1.2-1.8-3.2-2-3.9-2-1.7-.2-3.2 1-4 1s-2.1-1-3.5-.9c-1.8 0-3.5 1.1-4.4 2.7-1.9 3.2-.5 8 1.3 10.6.9 1.3 2 2.7 3.4 2.6 1.4-.1 1.9-.9 3.6-.9s2.2.9 3.7.9c1.5 0 2.5-1.3 3.4-2.6 1-1.5 1.5-3 1.5-3.1-.1 0-3.4-1.3-3.4-4.2ZM14.5 4.6c.8-1 1.3-2.3 1.2-3.6-1.1 0-2.4.8-3.2 1.7-.7.8-1.3 2.2-1.2 3.4 1.2.1 2.4-.6 3.2-1.5Z"/></svg>
            <div><strong>macOS</strong><span>Pilih chip Mac Anda</span></div>
            <small data-group-status="macos">2 installer</small>
          </div>
          <a class="direct-package" data-platform-variant="macos-arm64" href="{BASE}SONKUPIK-STUDIO-0.8.44-macOS-arm64.dmg">
            <span><strong>Apple Silicon</strong><small>M1 / M2 / M3 / M4 · DMG</small></span><b>Download</b>
          </a>
          <a class="direct-package" data-platform-variant="macos-x64" href="{BASE}SONKUPIK-STUDIO-0.8.44-macOS-x64.dmg">
            <span><strong>Intel Mac</strong><small>x64 · DMG</small></span><b>Download</b>
          </a>
          <p class="package-warning">Belum Developer ID signed/notarized. macOS Gatekeeper dapat memberi peringatan saat pertama dibuka.</p>
        </article>

        <article class="download-os-card" data-platform-download="linux">
          <div class="download-os-head">
            <span class="os-linux" aria-hidden="true">🐧</span>
            <div><strong>Linux</strong><span>x64 atau ARM64</span></div>
            <small data-group-status="linux">4 paket</small>
          </div>
          <div class="linux-arch-row"><span>x64</span>
            <a class="direct-package compact-package" data-platform-variant="linux-x64-appimage" href="{BASE}SONKUPIK-STUDIO-0.8.44-Linux-x64.AppImage"><strong>AppImage</strong><b>Download</b></a>
            <a class="direct-package compact-package" data-platform-variant="linux-x64-deb" href="{BASE}SONKUPIK-STUDIO-0.8.44-Linux-x64.deb"><strong>DEB</strong><b>Download</b></a>
          </div>
          <div class="linux-arch-row"><span>ARM64</span>
            <a class="direct-package compact-package" data-platform-variant="linux-arm64-appimage" href="{BASE}SONKUPIK-STUDIO-0.8.44-Linux-arm64.AppImage"><strong>AppImage</strong><b>Download</b></a>
            <a class="direct-package compact-package" data-platform-variant="linux-arm64-deb" href="{BASE}SONKUPIK-STUDIO-0.8.44-Linux-arm64.deb"><strong>DEB</strong><b>Download</b></a>
          </div>
        </article>
      </div>
      <p class="availability-note"><strong>Semua tombol di atas adalah download langsung.</strong> Anda tidak perlu membuka halaman GitHub Release untuk mencari file installer.</p>
'''

          en_block = f'''      <div class="direct-download-grid" data-platform-matrix aria-label="Direct downloads by operating system">
        <article class="download-os-card is-recommended" data-platform-download="windows">
          <div class="download-os-head">
            <svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2 3.5 10.5 2v9H2v-7.5Zm9.5-1.7L22 0v11h-10.5V1.8ZM2 12h8.5v9L2 19.5V12Zm9.5 0H22v11l-10.5-1.8V12Z"/></svg>
            <div><strong>Windows</strong><span>Windows 10/11 · x64</span></div>
            <small data-group-status="windows">Recommended</small>
          </div>
          <a class="direct-package primary-package" data-download="setup" href="{BASE}SONKUPIK-STUDIO-0.8.44-Setup.exe">
            <span><strong>Windows Setup</strong><small>Installer · <span data-setup-size>about 100 MB</span></small></span><b>Download</b>
          </a>
          <a class="direct-package" data-download="portable" href="{BASE}SONKUPIK-STUDIO-0.8.44-Portable.exe">
            <span><strong>Portable .exe</strong><small>No installation · <span data-portable-size>about 100 MB</span></small></span><b>Download</b>
          </a>
        </article>

        <article class="download-os-card" data-platform-download="macos">
          <div class="download-os-head">
            <svg class="platform-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.2 12.4c0-2.7 2.2-4 2.3-4.1-1.2-1.8-3.2-2-3.9-2-1.7-.2-3.2 1-4 1s-2.1-1-3.5-.9c-1.8 0-3.5 1.1-4.4 2.7-1.9 3.2-.5 8 1.3 10.6.9 1.3 2 2.7 3.4 2.6 1.4-.1 1.9-.9 3.6-.9s2.2.9 3.7.9c1.5 0 2.5-1.3 3.4-2.6 1-1.5 1.5-3 1.5-3.1-.1 0-3.4-1.3-3.4-4.2ZM14.5 4.6c.8-1 1.3-2.3 1.2-3.6-1.1 0-2.4.8-3.2 1.7-.7.8-1.3 2.2-1.2 3.4 1.2.1 2.4-.6 3.2-1.5Z"/></svg>
            <div><strong>macOS</strong><span>Choose your Mac chip</span></div>
            <small data-group-status="macos">2 installers</small>
          </div>
          <a class="direct-package" data-platform-variant="macos-arm64" href="{BASE}SONKUPIK-STUDIO-0.8.44-macOS-arm64.dmg">
            <span><strong>Apple Silicon</strong><small>M1 / M2 / M3 / M4 · DMG</small></span><b>Download</b>
          </a>
          <a class="direct-package" data-platform-variant="macos-x64" href="{BASE}SONKUPIK-STUDIO-0.8.44-macOS-x64.dmg">
            <span><strong>Intel Mac</strong><small>x64 · DMG</small></span><b>Download</b>
          </a>
          <p class="package-warning">Not Developer ID signed/notarized yet. macOS Gatekeeper may warn on first launch.</p>
        </article>

        <article class="download-os-card" data-platform-download="linux">
          <div class="download-os-head">
            <span class="os-linux" aria-hidden="true">🐧</span>
            <div><strong>Linux</strong><span>x64 or ARM64</span></div>
            <small data-group-status="linux">4 packages</small>
          </div>
          <div class="linux-arch-row"><span>x64</span>
            <a class="direct-package compact-package" data-platform-variant="linux-x64-appimage" href="{BASE}SONKUPIK-STUDIO-0.8.44-Linux-x64.AppImage"><strong>AppImage</strong><b>Download</b></a>
            <a class="direct-package compact-package" data-platform-variant="linux-x64-deb" href="{BASE}SONKUPIK-STUDIO-0.8.44-Linux-x64.deb"><strong>DEB</strong><b>Download</b></a>
          </div>
          <div class="linux-arch-row"><span>ARM64</span>
            <a class="direct-package compact-package" data-platform-variant="linux-arm64-appimage" href="{BASE}SONKUPIK-STUDIO-0.8.44-Linux-arm64.AppImage"><strong>AppImage</strong><b>Download</b></a>
            <a class="direct-package compact-package" data-platform-variant="linux-arm64-deb" href="{BASE}SONKUPIK-STUDIO-0.8.44-Linux-arm64.deb"><strong>DEB</strong><b>Download</b></a>
          </div>
        </article>
      </div>
      <p class="availability-note"><strong>Every button above is a direct download.</strong> You never need to browse the GitHub Release page to find an installer.</p>
'''

          def replace_panel(path: Path, block: str):
              text = path.read_text(encoding='utf-8')
              start = text.index('      <div class="platform-list"')
              end = text.index('      <div class="release-links">', start)
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding='utf-8')

          replace_panel(Path('site/index.html'), id_block)
          replace_panel(Path('site/en/index.html'), en_block)

          # Make supporting copy platform-neutral and explicit about direct files.
          replacements = {
              Path('site/index.html'): [
                  ('<div class="trust-item"><strong>Rilis terverifikasi</strong><span>Setup, Portable dan SHA-256 dipublikasikan bersama.</span></div>',
                   '<div class="trust-item"><strong>Rilis terverifikasi</strong><span>Paket Windows, macOS, Linux dan SHA-256 dipublikasikan bersama.</span></div>'),
                  ('<article class="step"><span class="step-num">01</span><h3>Install SONKUPIK STUDIO</h3><p>Klik Windows Setup di atas. Installer adalah pilihan yang direkomendasikan karena startup lebih cepat daripada Portable.</p></article>',
                   '<article class="step"><span class="step-num">01</span><h3>Download SONKUPIK STUDIO</h3><p>Pilih Windows, macOS atau Linux di panel atas, lalu klik paket yang sesuai dengan arsitektur komputer Anda.</p></article>'),
                  ('Ya. Paket publik SONKUPIK STUDIO dapat diunduh gratis dari halaman ini. Tombol utama mengarah langsung ke installer Windows release terbaru.',
                   'Ya. Paket publik SONKUPIK STUDIO dapat diunduh gratis dari halaman ini. Semua tombol Windows, macOS dan Linux mengarah langsung ke file paket resmi.'),
                  ('Tidak. Tombol Windows Setup dan Portable diarahkan langsung ke file rilis. GitHub dipakai di belakang layar sebagai host distribusi, checksums, release notes, source dan support teknis.',
                   'Tidak. Semua tombol Windows, macOS dan Linux diarahkan langsung ke file paket rilis. GitHub hanya dipakai di belakang layar sebagai host distribusi, checksums, release notes, source dan support teknis.'),
              ],
              Path('site/en/index.html'): [
                  ('<div class="trust-item"><strong>Verified release set</strong><span>Setup, Portable and SHA-256 are published together.</span></div>',
                   '<div class="trust-item"><strong>Verified release set</strong><span>Windows, macOS, Linux packages and SHA-256 are published together.</span></div>'),
                  ('<article class="step"><span class="step-num">01</span><h3>Install SONKUPIK STUDIO</h3><p>Click Windows Setup above. The installed build is recommended for faster startup than the Portable package.</p></article>',
                   '<article class="step"><span class="step-num">01</span><h3>Download SONKUPIK STUDIO</h3><p>Choose Windows, macOS or Linux in the panel above, then click the package that matches your computer architecture.</p></article>'),
                  ('Yes. Public SONKUPIK STUDIO packages can be downloaded for free from this page. The main button links directly to the latest Windows release installer.',
                   'Yes. Public SONKUPIK STUDIO packages can be downloaded for free from this page. Every Windows, macOS and Linux button links directly to an official package file.'),
                  ('No. Windows Setup and Portable buttons link directly to release files. GitHub is used behind the scenes for distribution hosting, checksums, release notes, source and technical support.',
                   'No. Every Windows, macOS and Linux download button links directly to a release package file. GitHub is only used behind the scenes for hosting, checksums, release notes, source and technical support.'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          # Simplify runtime: static links work immediately; JS only refreshes them to the latest release.
          js = Path('site/download.js')
          text = js.read_text(encoding='utf-8')
          text = re.sub(
              r'  function mountPlatformMatrix\(\) \{.*?\n  \}\n\n  function isAllowedReleaseUrl',
              '''  function mountPlatformMatrix() {\n    const availability = document.querySelector(".availability-note");\n    if (availability) {\n      const label = language === "en" ? "Every button above is a direct download." : "Semua tombol di atas adalah download langsung.";\n      const detail = language === "en" ? " The page refreshes package URLs from the latest official release automatically." : " Halaman memperbarui URL paket dari rilis resmi terbaru secara otomatis.";\n      availability.innerHTML = `<strong>${label}</strong>${detail}`;\n    }\n  }\n\n  function isAllowedReleaseUrl''',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'  function setPlatformSummary\(platform, hasPublicAssets\) \{.*?\n  \}\n\n  function bindVariant',
              '''  function setPlatformSummary(platform, hasPublicAssets) {\n    document.querySelectorAll(`[data-platform-download="${platform}"]`).forEach((card) => {\n      card.classList.toggle("is-unavailable", !hasPublicAssets);\n    });\n    const groupStatus = document.querySelector(`[data-group-status="${platform}"]`);\n    if (groupStatus && hasPublicAssets && platform !== "windows") {\n      groupStatus.textContent = platform === "macos"\n        ? (language === "en" ? "2 direct downloads" : "2 download langsung")\n        : (language === "en" ? "4 direct downloads" : "4 download langsung");\n    }\n  }\n\n  function bindVariant''',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace('    bindDirect(\'[data-platform-download="windows"]\', release.setup, copy.setup);\n', '')
          text = text.replace('    setPlatformSummary("macos", false);\n    setPlatformSummary("linux", false);\n', '')
          text = text.replace('  setPlatformSummary("macos", false);\n  setPlatformSummary("linux", false);\n', '')
          js.write_text(text, encoding='utf-8')

          # New, compact visual hierarchy: all OS packages visible immediately in the hero panel.
          css = Path('site/polish.css')
          style = css.read_text(encoding='utf-8')
          marker = '/* Direct-download all-platform panel */'
          if marker not in style:
              style += r'''

/* Direct-download all-platform panel */
.direct-download-grid{display:grid;gap:9px;padding:16px 18px 10px}.download-os-card{padding:12px;border:1px solid rgba(160,190,214,.14);border-radius:11px;background:rgba(255,255,255,.012)}.download-os-card.is-recommended{border-color:rgba(120,223,214,.3);background:rgba(120,223,214,.032)}.download-os-head{display:grid;grid-template-columns:27px minmax(0,1fr) auto;align-items:center;gap:10px;margin-bottom:9px}.download-os-head>div{display:grid;line-height:1.15}.download-os-head strong{font-size:.78rem;font-weight:690}.download-os-head span{margin-top:3px;color:#8295a2;font-size:.58rem}.download-os-head>small{padding:3px 6px;border:1px solid rgba(120,223,214,.18);border-radius:999px;color:#89bdb7;font-size:.52rem;font-weight:650}.direct-package{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.014);transition:.16s ease}.direct-package:hover{transform:translateY(-1px);border-color:rgba(120,223,214,.45);background:rgba(120,223,214,.045)}.direct-package>span{display:grid;line-height:1.15}.direct-package strong{font-size:.68rem;font-weight:680}.direct-package small{margin-top:3px;color:#788b98;font-size:.54rem;font-weight:520}.direct-package>b{flex:0 0 auto;color:var(--accent);font-size:.59rem;font-weight:720;letter-spacing:.025em}.primary-package{border-color:rgba(120,223,214,.32);background:linear-gradient(135deg,rgba(120,223,214,.09),rgba(121,169,232,.05))}.package-warning{margin:8px 1px 0;color:#8d856f;font-size:.54rem;line-height:1.45}.linux-arch-row{display:grid;grid-template-columns:42px 1fr 1fr;align-items:center;gap:6px;margin-top:6px}.linux-arch-row>span{color:#8295a2;font-size:.56rem;font-weight:680}.compact-package{min-height:37px;margin-top:0;padding:6px 8px}.compact-package strong{font-size:.61rem}.compact-package>b{font-size:.52rem}.download-os-card.is-unavailable{opacity:.7}.direct-download-grid+.availability-note{margin-top:4px}.release-links{position:relative}.release-links a[data-release-link]{opacity:.78}
@media(max-width:620px){.direct-download-grid{padding-inline:14px}.download-os-head{grid-template-columns:27px minmax(0,1fr);}.download-os-head>small{grid-column:2;justify-self:start}.linux-arch-row{grid-template-columns:42px 1fr 1fr}.direct-package{min-height:46px}}
'''
              css.write_text(style, encoding='utf-8')

          # Strengthen the site gate: every public platform must have a static direct-file fallback.
          validator = Path('tools/validate-site.py')
          v = validator.read_text(encoding='utf-8')
          anchor = '    if content.count(\'class="faq-item"\') < 10:\n'
          gate = '''    direct_packages = (\n        "SONKUPIK-STUDIO-0.8.44-Setup.exe",\n        "SONKUPIK-STUDIO-0.8.44-Portable.exe",\n        "SONKUPIK-STUDIO-0.8.44-macOS-arm64.dmg",\n        "SONKUPIK-STUDIO-0.8.44-macOS-x64.dmg",\n        "SONKUPIK-STUDIO-0.8.44-Linux-x64.AppImage",\n        "SONKUPIK-STUDIO-0.8.44-Linux-x64.deb",\n        "SONKUPIK-STUDIO-0.8.44-Linux-arm64.AppImage",\n        "SONKUPIK-STUDIO-0.8.44-Linux-arm64.deb",\n    )\n    for package in direct_packages:\n        direct_url = f"https://github.com/{REPOSITORY}/releases/download/v0.8.44/{package}"\n        if direct_url not in content:\n            fail(f"{path}: missing static direct-download fallback for {package}", errors)\n\n'''
          if gate not in v:
              v = v.replace(anchor, gate + anchor)
          validator.write_text(v, encoding='utf-8')
          PY

      - name: Validate direct-download website
        run: python tools/validate-site.py

      - name: Commit landing synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html site/en/index.html site/download.js site/polish.css tools/validate-site.py
          git diff --cached --check
          git commit -m 'Make all platform installers direct downloads'
          git push origin HEAD:main
