name: Release SONKUPIK STUDIO on all platforms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-all-platforms.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: release-all-platforms
  cancel-in-progress: false

jobs:
  release:
    name: Publish verified all-platform artifacts
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      LINUX_QA_RUN: '31454406052'
      MACOS_QA_RUN: '31453176823'

    steps:
      - uses: actions/checkout@v6
        name: Checkout distribution repository

      - name: Resolve pinned release provenance
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('.github/release-source.json','utf8')).version")"
          PINNED_SOURCE="$(node -p "JSON.parse(require('fs').readFileSync('.github/release-source.json','utf8')).source_ref")"
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PINNED_SOURCE" =~ ^[0-9a-fA-F]{40}$ ]]
          printf 'RELEASE_VERSION=%s\nPINNED_SOURCE=%s\n' "$RELEASE_VERSION" "$PINNED_SOURCE" >> "$GITHUB_ENV"
          gh release view "$RELEASE_VERSION" --repo "$REPOSITORY" >/dev/null

      - name: Download verified Linux QA artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged/linux
          gh run download "$LINUX_QA_RUN" --repo "$REPOSITORY" \
            --pattern 'SONKUPIK-STUDIO-Linux-*' \
            --dir staged/linux
          find staged/linux -maxdepth 5 -type f -print | sort

      - name: Download verified macOS QA artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged/macos
          gh run download "$MACOS_QA_RUN" --repo "$REPOSITORY" \
            --pattern 'SONKUPIK-STUDIO-macOS-*' \
            --dir staged/macos
          find staged/macos -maxdepth 5 -type f -print | sort

      - name: Verify artifact provenance and trust status
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r status; do
            grep -Fq "source_commit=$PINNED_SOURCE" "$status" || {
              echo "Artifact provenance mismatch: $status" >&2
              cat "$status" >&2
              exit 1
            }
            cat "$status"
          done < <(find staged/linux staged/macos -type f \( -name 'linux-*-status.txt' -o -name 'macos-*-status.txt' \) | sort)

          test "$(find staged/linux -type f -name 'linux-*-status.txt' | wc -l | tr -d ' ')" -eq 2
          test "$(find staged/macos -type f -name 'macos-*-status.txt' | wc -l | tr -d ' ')" -eq 2

          # v0.8.44 macOS builds are intentionally published with a visible
          # Gatekeeper warning because Developer ID credentials are not yet
          # configured in this repository.
          while IFS= read -r status; do
            grep -Fq 'developer_id_signed=false' "$status"
            grep -Fq 'notarized=false' "$status"
          done < <(find staged/macos -type f -name 'macos-*-status.txt' | sort)

      - name: Stage all new public packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p selected
          find staged/linux -type f \( -name 'SONKUPIK-STUDIO-*-Linux-x64.AppImage' -o -name 'SONKUPIK-STUDIO-*-Linux-x64.deb' -o -name 'SONKUPIK-STUDIO-*-Linux-arm64.AppImage' -o -name 'SONKUPIK-STUDIO-*-Linux-arm64.deb' \) -exec cp {} selected/ \;
          find staged/macos -type f \( -name 'SONKUPIK-STUDIO-*-macOS-x64.dmg' -o -name 'SONKUPIK-STUDIO-*-macOS-arm64.dmg' \) -exec cp {} selected/ \;
          test "$(find selected -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 6
          ls -lh selected

      - name: Upload macOS and Linux packages to public release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_VERSION" --repo "$REPOSITORY" selected/* --clobber

      - name: Regenerate complete SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf checksum-input
          mkdir checksum-input
          gh release download "$RELEASE_VERSION" --repo "$REPOSITORY" --dir checksum-input --pattern 'SONKUPIK-STUDIO-*'
          (
            cd checksum-input
            find . -maxdepth 1 -type f -name 'SONKUPIK-STUDIO-*' -printf '%f\n' | sort | while read -r file; do
              sha256sum "$file"
            done
          ) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt | tr -d ' ')" -eq 8
          gh release upload "$RELEASE_VERSION" --repo "$REPOSITORY" SHA256SUMS.txt --clobber

      - name: Add cross-platform release notes and macOS Gatekeeper notice
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_VERSION" --repo "$REPOSITORY" --json body --jq .body > release-body.md
          python <<'PY'
          from pathlib import Path
          path = Path('release-body.md')
          body = path.read_text(encoding='utf-8')
          marker = '## Cross-platform public packages'
          if marker not in body:
              body = body.rstrip() + '''\n\n## Cross-platform public packages\n\nSONKUPIK STUDIO v0.8.44 is now published for all currently built desktop targets:\n\n- Windows x64: Setup + Portable\n- macOS Intel/x64: DMG\n- macOS Apple Silicon/ARM64: DMG\n- Linux x64: AppImage + DEB\n- Linux ARM64: AppImage + DEB\n\n### macOS Gatekeeper notice\n\nThe v0.8.44 macOS DMGs are **unsigned and not Apple-notarized** because Developer ID credentials are not configured yet. macOS may show a Gatekeeper warning or block first launch. Verify the downloaded DMG against `SHA256SUMS.txt`. The packages passed CI build, DMG integrity, architecture, native-module and factory-preset verification, but real K500 hardware validation on each target OS is still recommended before critical use.\n'''
              path.write_text(body, encoding='utf-8')
          PY
          gh release edit "$RELEASE_VERSION" --repo "$REPOSITORY" --notes-file release-body.md

      - name: Verify public release asset families
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_VERSION" --repo "$REPOSITORY" --json assets --jq '.assets[].name')"
          printf '%s\n' "$assets"
          for pattern in \
            'Setup.exe' \
            'Portable.exe' \
            'macOS-x64.dmg' \
            'macOS-arm64.dmg' \
            'Linux-x64.AppImage' \
            'Linux-x64.deb' \
            'Linux-arm64.AppImage' \
            'Linux-arm64.deb' \
            'SHA256SUMS.txt'; do
            grep -Fq "$pattern" <<<"$assets" || { echo "Missing public asset family: $pattern" >&2; exit 1; }
          done
          echo "All platform asset families are public on $RELEASE_VERSION"

      - name: Refresh GitHub Pages release snapshot
        run: gh workflow run pages.yml --repo "$REPOSITORY" --ref main
